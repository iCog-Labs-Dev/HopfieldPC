# CIFAR-10 prototype retrieval, identity bridge vs frozen Hopfield bridge (FabricPC, PC-trained).
seeds: [0, 1, 2, 3, 4]
data_dir: "data"
reports_dir: "reports/cifar10_pc_prototype_retrieval"
device: "auto"            # auto | cpu | cuda

val_size: 5000            # held out of train, used only to select beta
train_subset: null        # null = all remaining train images
test_subset: null         # null = all 10 000 test images
epochs: 10
batch_size: 128
lr: 0.001
eval_batch_size: 500

center_prototypes: true
prototypes_per_class: 8
# beta* = argmax of mean validation head_acc over these sets; their levels are
# deliberately not in the test grids below.
beta_selection_sets: [["clean", 0], ["gaussian", 0.15], ["salt_pepper", 0.075]]
beta_values: [0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0]

# Noise grids (each starts at the clean level 0); occlusion sizes are square sides in pixels.
gaussian_sigmas: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]
salt_pepper_probs: [0.0, 0.02, 0.05, 0.1, 0.2, 0.3]
occlusion_sizes: [0, 8, 12, 16]

cost:
  batch_size: 256
  num_threads: null

# --quick overrides.
quick:
  reports_dir: "reports/cifar10_pc_prototype_retrieval_quick"
  seeds: [0]
  epochs: 1
  val_size: 500
  train_subset: 2000
  test_subset: 1000
  beta_values: [1.0, 5.0, 20.0, 100.0]
  gaussian_sigmas: [0.0, 0.1, 0.3]
  salt_pepper_probs: [0.0, 0.05, 0.2]
  occlusion_sizes: [0, 8, 16]
